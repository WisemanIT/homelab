mqtt:
  enabled: true
  host: YOUR_HA_IP          # Home Assistant IP
  port: 1883
  topic_prefix: frigate
  client_id: frigate
  user: frigate-mqtt
  password: YOUR_MQTT_PASSWORD
 
detectors:
  ov:
    type: openvino
    device: GPU             # Intel HD 530 iGPU
 
model:
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr
  path: /openvino-model/ssdlite_mobilenet_v2.xml
 
cameras:
  # --- Camera 1: Garage ---
  garage:
    ffmpeg:
      inputs:
        - path: rtsp://USERNAME:PASSWORD@192.168.2.XXX:554/stream1
          roles:
            - record           # Full 2K (2304x1296)
        - path: rtsp://USERNAME:PASSWORD@192.168.2.XXX:554/stream2
          roles:
            - detect           # Substream 640x360
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    record:
      enabled: true
      alerts:
        retain:
          days: 14
      detections:
        retain:
          days: 14
      continuous:
        days: 0
      motion:
        days: 30
    snapshots:
      enabled: true
      retain:
        default: 14
    objects:
      track:
        - person
        - car
        - bus
      filters:
        person:
          min_score: 0.4
          threshold: 0.5
        car:
          min_score: 0.4
          threshold: 0.5
        bus:
          min_score: 0.4
          threshold: 0.5
 
  # --- Camera 2: Front Yard ---
  front:
    ffmpeg:
      input_args: preset-rtsp-udp    # Required — fixes timestamp crash on this camera
      inputs:
        - path: rtsp://USERNAME:PASSWORD@192.168.1.XXX:554/stream1
          roles:
            - record           # Full 2K (2304x1296)
        - path: rtsp://USERNAME:PASSWORD@192.168.1.XXX:554/stream2
          roles:
            - detect           # Substream 640x360
    detect:
      enabled: true
      width: 640
      height: 360
      fps: 5
    record:
      enabled: true
      alerts:
        retain:
          days: 14
      detections:
        retain:
          days: 14
      continuous:
        days: 0
      motion:
        days: 30
    snapshots:
      enabled: true
      retain:
        default: 14
    objects:
      track:
        - person
      filters:
        person:
          min_score: 0.4
          threshold: 0.5
 
# Global recording
record:
  enabled: true
  continuous:
    days: 0
  motion:
    days: 30
 
version: 0.17-0
 
semantic_search:
  enabled: true
  model_size: small
 
face_recognition:
  enabled: true
  model_size: small
 
lpr:
  enabled: true
 
classification:
  bird:
    enabled: true