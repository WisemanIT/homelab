metricsConfig:
  monitor:
    interval: 45
    unit: SECONDS
  history:
    interval: 30
    unit: MINUTES
    purging:
      olderThan: 14
      unit: DAYS
      purgeEvery: 1
      purgeEveryUnit: DAYS
  cache:
    enabled: false
    duration: 5
    unit: SECONDS
user:
  username: YOUR_USERNAME
  password: YOUR_PASSWORD
processes:
  enabled: true
linux:
  journalLogs:
    enabled: true
  systemDaemonServiceManagement:
    enabled: true
docker:
  enabled: true
connectivityCheck:
  enabled: true
  address: https://ifconfig.me
internetServicesCheck:
  enabled: true
  services:
    - address: google.com
      name: Google
      port: 80
    - address: one.one.one.one
      name: Cloudflare
      port: 80
    - address: connectivity.office.com
      name: Microsoft
      port: 80
mDNS:
  enabled: true
upnp:
  enabled: true
selfSignedCertificates:
  enabled: true
  populateCN: true
  populateSAN: true
formatting:
  temperatureUnit: system